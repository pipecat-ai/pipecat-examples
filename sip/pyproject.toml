[project]
name = "sip-examples"
version = "0.1.0"
description = "SIP transport examples for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[sip,daily,deepgram,cartesia,openai,silero,runner]>=1.17.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
