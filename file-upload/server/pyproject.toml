[project]
name = "file-upload"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,aws,cartesia,daily,deepgram,google,livekit,openai,runner,silero,websocket,webrtc]>=1.13.0",
    "pipecatcloud",
    # For bot_gcs.py (GCS-backed uploads); S3-backed uploads (bot_s3.py) use
    # aiobotocore, which pipecat-ai[aws] already provides.
    "google-cloud-storage>=2.18.0,<4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
