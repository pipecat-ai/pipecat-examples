[project]
name = "storytelling-chatbot"
version = "0.1.0"
description = "Pipecat example - voice-driven interactive storytelling bot"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[daily,deepgram,elevenlabs,google,runner,silero,webrtc]>=1.9.0",
    "pipecatcloud>=1.2.0",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
