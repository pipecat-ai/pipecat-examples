[project]
name = "client-function-calling-server"
version = "0.1.0"
description = "Pipecat example - client-side function calling (server)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "pipecat-ai[cartesia,daily,deepgram,openai,runner]>=1.8.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
