[project]
name = "pipecat-langfuse-tracing"
version = "0.1.0"
description = "A Pipecat example using Langfuse tracing"
requires-python = ">=3.11"
dependencies = [
    # LangfuseRecordingUploader (pipecat.utils.tracing.langfuse) is not released yet, so
    # install pipecat from the PR branch (pipecat-ai/pipecat#5285). Switch back to a
    # version pin once it ships.
    "pipecat-ai[daily,webrtc,websocket,silero,cartesia,deepgram,openai,tracing,runner] @ git+https://github.com/pipecat-ai/pipecat.git@jh/turn-audio-turn-number",
    "pipecatcloud>=0.7.1",
    "opentelemetry-exporter-otlp-proto-http",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]