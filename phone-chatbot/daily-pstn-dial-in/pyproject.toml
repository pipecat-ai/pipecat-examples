[project]
name = "daily-pstn-dial-in"
version = "0.1.0"
description = "Daily PSTN Dial-in example"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[daily,deepgram,cartesia,openai,silero,runner,webrtc]>=1.8.0",
    "pipecatcloud>=1.2.0",
]

[dependency-groups]
dev = [
    "pre-commit~=4.2.0",
    "ruff~=0.12.1",
    "python-dotenv>=1.0.1,<2.0.0",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
