[project]
name = "expressivity"
version = "0.1.0"
description = "A listen-only Pipecat bot that reads how each turn was said: Pipecat Voice Reader hears the voice, Pipecat Tone reads the words"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[daily,deepgram,expressivity,runner,silero,webrtc]>=1.16.0",
    "pipecatcloud>=1.6.0",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]
