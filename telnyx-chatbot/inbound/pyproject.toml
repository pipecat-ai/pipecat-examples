[project]
name = "telnyx-chatbot-dial-in"
version = "0.1.0"
description = "Telnyx dial-in example for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[websocket,elevenlabs,openai,silero,deepgram,runner]>=1.16.0",
  "pipecatcloud>=1.6.1"
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
